      <li>
        <a class="photo-card" href="./$slug/" aria-labelledby="title-$slug"
           data-image="../$viewer_image" data-width="$viewer_width" data-license="$license" data-license-url="$license_url">
          <span class="photo-preview">
            <img src="../$thumbnail" alt="$alt" loading="lazy" decoding="async">
          </span>
          <h2 id="title-$slug">$title</h2>
          <p>$date · $photographer</p>
        </a>
      </li>
